name: publish-store-release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm run validate
      - run: npm run test:scripts
      - run: npm run test:store-release
      - run: npm run build:store-release -- --commit "$(git rev-parse HEAD)"
      - run: npm run publish:store-release -- "dist/xopc-skills-$(node -p "require('./package.json').version").zip" --publish
        env:
          XOPC_API_BASE: https://store.xopc.ai
          XOPC_API_KEY: ${{ secrets.XOPC_STORE_API_KEY }}
